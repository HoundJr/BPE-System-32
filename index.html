<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Shop Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- LOGIN -->
<section id="view-login" class="view">
  <form id="login-form" class="login-box">
    <h1>Job Shop Dashboard</h1>
    <label>Email <input type="email" id="login-email" required autocomplete="username" /></label>
    <label>Password <input type="password" id="login-password" required autocomplete="current-password" /></label>
    <button type="submit">Log in</button>
    <p id="login-error" class="error hidden"></p>
  </form>
</section>

<!-- APP SHELL -->
<div id="app-shell" class="hidden">
  <div id="error-banner" class="error-banner hidden no-print"></div>
  <nav class="topnav no-print">
    <div class="nav-left">
      <button data-view="board" class="nav-btn active">Board</button>
      <button data-view="customers" class="nav-btn">Customers</button>
    </div>
    <div class="nav-right">
      <button id="btn-new-job" class="nav-btn primary">+ New Job</button>
      <button id="btn-logout" class="nav-btn">Log out</button>
    </div>
  </nav>

  <main id="app-main">

    <!-- BOARD -->
    <section id="view-board" class="view">
      <div class="board-controls no-print">
        <button id="cal-prev" class="nav-btn">&larr; Prev week</button>
        <button id="cal-today" class="nav-btn">This week</button>
        <button id="cal-next" class="nav-btn">Next week &rarr;</button>
        <span id="cal-range" class="cal-range"></span>
      </div>
      <div id="cashflow-summary" class="cashflow-summary no-print"></div>
      <div id="status-legend" class="status-legend no-print"></div>
      <div id="unscheduled-tray" class="unscheduled-tray"></div>
      <div class="cal-wrapper">
        <div id="cal-header" class="cal-header"></div>
        <div id="cal-grid" class="cal-grid"></div>
      </div>
    </section>

    <!-- CUSTOMERS -->
    <section id="view-customers" class="view hidden">
      <h2>Customers</h2>
      <form id="customer-form" class="inline-form">
        <input type="text" id="cust-number" placeholder="Customer #" required style="width:8em" />
        <input type="text" id="cust-name" placeholder="Customer name" required />
        <input type="tel" id="cust-phone" placeholder="Phone" />
        <input type="email" id="cust-email" placeholder="Email" />
        <button type="submit">Add customer</button>
      </form>
      <table class="data-table">
        <thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>
        <tbody id="customers-tbody"></tbody>
      </table>
    </section>

    <!-- NEW JOB -->
    <section id="view-new-job" class="view hidden">
      <h2>New Job</h2>
      <form id="new-job-form">
        <label>Customer
          <select id="job-customer" required></select>
        </label>
        <div id="new-customer-fields" class="hidden new-customer-fields">
          <label>New customer # <input type="text" id="job-new-cust-number" /></label>
          <label>New customer name <input type="text" id="job-new-cust-name" /></label>
          <label>Phone <input type="tel" id="job-new-cust-phone" /></label>
          <label>Email <input type="email" id="job-new-cust-email" /></label>
        </div>
        <label>Description <input type="text" id="job-description" required /></label>
        <label>Part number <input type="text" id="job-part-number" /></label>
        <label>Quantity <input type="number" id="job-qty" min="1" value="1" /></label>
        <label>Start date <input type="date" id="job-start-date" /></label>
        <label>Due date <input type="date" id="job-due-date" /></label>
        <button type="submit">Create job</button>
      </form>
    </section>

    <!-- JOB DETAIL / TRAVELER -->
    <section id="view-job-detail" class="view hidden">
      <div class="traveler-header no-print">
        <button id="btn-back-to-board">&larr; Back to board</button>
        <div class="traveler-header-right">
          <button id="btn-print-job">Print traveler</button>
          <button id="btn-delete-job" class="btn-danger">Delete job</button>
        </div>
      </div>

      <div id="print-traveler" class="print-traveler"></div>

      <div class="traveler">
        <div class="traveler-title">
          <h2 id="jd-job-number">—</h2>
          <span id="jd-status-badge" class="status-badge">—</span>
        </div>

        <div class="grid-2">
          <label>Customer
            <select id="jd-customer-select"></select>
            <span class="field-hint">Changing this reassigns the job number to the new customer's next number</span>
          </label>
          <label>Description <input type="text" id="jd-description" /></label>
          <label>Part number <input type="text" id="jd-part-number" /></label>
          <label>Quantity <input type="number" id="jd-qty" min="1" /></label>
          <label>Start date <input type="date" id="jd-start-date" /></label>
          <label>Due date <input type="date" id="jd-due-date" /></label>
          <label>Reference class <input type="text" id="jd-reference-class" placeholder="e.g. simple lathe work, stainless" /></label>
        </div>

        <div id="lost-control" class="lost-control no-print"></div>
        <div id="stage-accordion" class="stage-accordion"></div>

        <fieldset>
          <legend>Operations</legend>
          <div id="operations-list" class="operations-list"></div>
          <form id="operation-form" class="inline-form no-print">
            <input type="text" id="op-name" placeholder="Operation (e.g. Rough turn)" required />
            <input type="text" id="op-notes" placeholder="Notes" />
            <button type="submit">Add operation</button>
          </form>
        </fieldset>

        <fieldset>
          <legend>Time log <span id="time-log-total" class="total-badge"></span></legend>
          <table class="data-table">
            <thead><tr><th>Date</th><th>Operation</th><th>Hours</th><th>Note</th><th class="no-print"></th></tr></thead>
            <tbody id="time-log-tbody"></tbody>
          </table>
          <form id="time-log-form" class="inline-form no-print">
            <input type="date" id="tl-date" required />
            <input type="text" id="tl-operation" placeholder="Operation" />
            <input type="number" step="0.1" min="0" id="tl-hours" placeholder="Hours" required style="width:6em" />
            <input type="text" id="tl-note" placeholder="Note" />
            <button type="submit">Add entry</button>
          </form>
        </fieldset>

        <fieldset>
          <legend>Notes</legend>
          <textarea id="jd-notes" rows="4"></textarea>
        </fieldset>
      </div>
    </section>

  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
